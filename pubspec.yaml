name: emby_player
description: Emby 播放器 - Windows 版(libmpv 内核 + Trakt 同步)
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 网络与存储
  http: ^1.2.2
  shared_preferences: ^2.3.2
  uuid: ^4.5.1

  # 播放内核:libmpv (FFmpeg + libass),Windows 走 D3D11 硬解
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_windows_video: ^1.0.10

  # UI
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.0
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
